name: Build y deploy a GitHub Pages

# main se publica en tc-ii.github.io/TurboSpice/ y dev en tc-ii.github.io/TurboSpice/dev/.
# Pages tiene un solo sitio por repo y cada deploy lo reemplaza entero: por eso el job «site»
# compila las dos ramas (cada una con su ruta base) y «deploy» las sube juntas.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 4.0.10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El motor sólo se recompila si cambian sus fuentes de build
      - name: Caché del motor
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine/dist-engine
          key: engine-${{ env.EMSDK_VERSION }}-${{ hashFiles('engine/build.sh', 'engine/spinit', 'engine/osdi/imports.c', 'engine/icarus/**') }}

      - name: Setup emsdk
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Compilar ngspice a WASM
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bison flex gperf autoconf
          bash engine/build.sh

      # Para bajar el motor compilado desde una rama o PR sin esperar al deploy:
      #   gh run download <id> -n engine -D engine/dist-engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: engine/dist-engine
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # tsc -b (en npm run build) sólo mira src/: esto suma los tests unitarios y los scripts .ts
      - name: Tipos de los tests y los scripts
        run: npx tsc -p tsconfig.test.json
      - name: Lint (ESLint)
        run: npm run lint
      - name: Traducciones (textos en español fuera de es.ts o sin traducir)
        run: node scripts/i18n/check.mjs
      - name: Smoke test del motor
        run: npm run smoke
      - name: Verilog (Yosys + Icarus + ngspice)
        run: npm run hdl
      # tests unitarios con cobertura de src/: el resumen va a la página del run y el detalle a un artefacto
      - name: Tests unitarios (con cobertura)
        run: |
          npm run coverage
          node -e "const t=require('./coverage/coverage-summary.json').total;const r=(k)=>'| '+k+' | '+t[k].pct+' % | '+t[k].covered+' / '+t[k].total+' |';console.log(['### Cobertura de src/','','| | % | cubiertas |','|---|---|---|',r('lines'),r('statements'),r('functions'),r('branches')].join('\\n'))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14
          if-no-files-found: ignore
      # Los modelos de PDK (open_pdks) se bajan una vez por versión: gf180 pesa 170 MB
      - name: Caché de los PDK
        uses: actions/cache@v4
        with:
          path: .cache/pdk
          key: pdk-${{ hashFiles('scripts/build-pdk.ts', 'scripts/build-pdk-gf180.ts') }}

      - run: npm run build
        env:
          # OAuth Client ID público (Settings → Variables); vacío = sin inicio de sesión con Google
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # dist/ ya trae el motor (npm run assets lo copia a public/engine). El nombre no empieza
      # con «site-» para que el deploy (pattern: site-*) no lo tome por un sitio.
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-dist
          path: dist
          retention-days: 1

  e2e:
    name: E2E ${{ matrix.suite }}
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cada entrada corre tests/e2e/<suite>.mjs, o las de `files` en un mismo runner (las cortas)
        suite: [features, save, panes, verilog, examples, simulation, editor, edit-tools, study, performance]
        include:
          - suite: edit-tools
            files: wires rotate shapes placing dialogs shortcuts
          # hierarchy.mjs queda afuera hasta reescribirlo: arranca con Alt+B (convertir la selección
          # en subcircuito), que se sacó de la interfaz (ver src/project/extract.ts)
          - suite: study
            files: templates deviceparams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-dist
          path: dist
      - name: E2E ${{ matrix.suite }} en Chrome
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: |
          npx vite preview --port 4173 --strictPort &
          timeout 30 bash -c 'until curl -sf http://localhost:4173/TurboSpice/ >/dev/null; do sleep 1; done'
          rc=0
          for f in ${{ matrix.files || matrix.suite }}; do
            echo "::group::$f"
            node tests/e2e/$f.mjs http://localhost:4173/TurboSpice/ test-results || { rc=1; echo "::error::E2E $f falló"; }
            echo "::endgroup::"
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  site:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            base: /TurboSpice/
            channel: ''
          - branch: dev
            base: /TurboSpice/dev/
            channel: dev
    # si dev no compila, el sitio sale sin /dev/ en vez de frenar el deploy de main
    continue-on-error: ${{ matrix.branch == 'dev' }}
    steps:
      - name: ¿Existe la rama?
        id: ref
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" "${{ matrix.branch }}" >/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "La rama ${{ matrix.branch }} no existe: no se publica"
          fi

      - uses: actions/checkout@v4
        if: steps.ref.outputs.ok == 'true'
        with:
          ref: ${{ matrix.branch }}

      - name: Caché del motor
        if: steps.ref.outputs.ok == 'true'
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine/dist-engine
          key: engine-${{ env.EMSDK_VERSION }}-${{ hashFiles('engine/build.sh', 'engine/spinit', 'engine/osdi/imports.c', 'engine/icarus/**') }}

      - name: Setup emsdk
        if: steps.ref.outputs.ok == 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Compilar ngspice a WASM
        if: steps.ref.outputs.ok == 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bison flex gperf autoconf
          bash engine/build.sh

      - uses: actions/setup-node@v4
        if: steps.ref.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.ref.outputs.ok == 'true'
        run: npm ci
      - if: steps.ref.outputs.ok == 'true'
        name: Caché de los PDK
        uses: actions/cache@v4
        with:
          path: .cache/pdk
          key: pdk-${{ hashFiles('scripts/build-pdk.ts', 'scripts/build-pdk-gf180.ts') }}
      - if: steps.ref.outputs.ok == 'true'
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.base }}
          VITE_CHANNEL: ${{ matrix.channel }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        if: steps.ref.outputs.ok == 'true'
        with:
          name: site-${{ matrix.branch }}
          path: dist
          retention-days: 1

  deploy:
    needs: site
    runs-on: ubuntu-latest
    # un deploy por vez; el último en correr junta las puntas de las dos ramas
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: sites
      - name: Juntar main en / y dev en /dev/
        run: |
          # sin main no se publica nada: el sitio estable no puede quedar vacío
          test -d sites/site-main || { echo "Falta el build de main"; exit 1; }
          mkdir -p site
          cp -r sites/site-main/. site/
          if [ -d sites/site-dev ]; then mkdir -p site/dev && cp -r sites/site-dev/. site/dev/; else echo "Sin build de dev: no se publica /dev/"; fi
          ls site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
