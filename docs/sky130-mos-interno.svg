<text x="130" y="540" class="sm" text-anchor="middle">C<tspan baseline-shift='sub' font-size='10'>GB</tspan> (G→B', intr. + cgbo): no dibujada</text>
<text x="40" y="650" class="note" text-anchor="start">Cada transistor del PDK es un .subckt con UN solo elemento M: no agrega R, C ni diodos externos.</text>
<text x="40" y="670" class="note" text-anchor="start">Todo lo dibujado sale de las llaves del modelo BSIM4 (iguales en los 180 bins .model …__model.0 … .179,</text>
<text x="40" y="690" class="note" text-anchor="start">que ngspice elige según W y L):</text>
<text x="40" y="710" class="note" text-anchor="start">• rbodymod = 1 → red de 5 resistencias de sustrato (RBPB, RBPD, RBPS, RBDB, RBSB)</text>
<text x="40" y="730" class="note" text-anchor="start">• diomod = 1 → diodos de juntura S-B y D-B (con AS/AD, PS/PD)      • rgatemod = 0 → sin R de compuerta</text>
<text x="40" y="750" class="note" text-anchor="start">• rdsmod = 0 → R de source/drain (rdsw) incluida en la ecuación de I_ds, sin nodos internos</text>
<text x="40" y="770" class="note" text-anchor="start">• igcmod = igbmod = 0 → sin corriente de túnel de compuerta    • trnqsmod = acnqsmod = 0 → modelo cuasi-estático</text>
<text x="40" y="790" class="note" text-anchor="start">Igual para pfet_01v8, *_g5v0d10v5, *_03v3_nvt… (en los PMOS los diodos van al revés: p+ → n-well).</text>
</svg>